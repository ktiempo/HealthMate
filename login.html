<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthMate | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: url('Images/bg1.jpg') no-repeat center center/cover;
      position: relative;
    }

    /* Overlay for background */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 136, 169, 0.7);
      z-index: 0;
    }

    .login-container {
      position: relative;
      z-index: 1;
      background: white;
      padding: 40px 35px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-container h2 {
      color: #0088a9;
      margin-bottom: 25px;
      font-size: 2rem;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px 12px 40px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: 0.3s;
    }

    .input-group input:focus {
      border-color: #0088a9;
      outline: none;
    }

    .input-group i {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #0088a9;
      font-size: 1.2rem;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #0088a9;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.3s ease;
      font-weight: 600;
    }

    button:hover {
      background: #006f88;
    }

    .extra-links {
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .extra-links a {
      color: #0088a9;
      text-decoration: none;
      font-weight: 500;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2><i class="bi bi-heart-pulse"></i> HealthMate Login</h2>
    <form action="#" method="POST">
      <div class="input-group">
        <i class="bi bi-person"></i>
        <input type="text" name="username" placeholder="Enter Username" required>
      </div>

      <div class="input-group">
        <i class="bi bi-lock"></i>
        <input type="password" name="password" placeholder="Enter Password" required>
      </div>

      <button type="submit">Login</button>

      <div class="extra-links">
        <p><a href="#">Forgot Password?</a></p>
        <p><a href="index.html">← Back to Home</a></p>
      </div>
    </form>
  </div>

</body>
</html>
